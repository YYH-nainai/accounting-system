{% extends "base.html" %}
{% block title %}首頁 - 會計管理系統{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="page-title mb-0">首頁</h4>
    <span class="text-muted">歡迎, {{ user.display_name }}</span>
</div>

<div class="row g-4">
    <div class="col-md-3">
        <div class="card text-center p-4">
            <i class="bi bi-journal-text" style="font-size: 2rem; color: #3498db;"></i>
            <h5 class="mt-2">會計科目</h5>
            <a href="/accounts" class="btn btn-outline-primary btn-sm mt-2">管理科目</a>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-center p-4">
            <i class="bi bi-receipt" style="font-size: 2rem; color: #2ecc71;"></i>
            <h5 class="mt-2">傳票管理</h5>
            <a href="/vouchers" class="btn btn-outline-success btn-sm mt-2">輸入傳票</a>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-center p-4">
            <i class="bi bi-book" style="font-size: 2rem; color: #e67e22;"></i>
            <h5 class="mt-2">總帳查詢</h5>
            <a href="/ledger" class="btn btn-outline-warning btn-sm mt-2">查詢總帳</a>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-center p-4">
            <i class="bi bi-pie-chart" style="font-size: 2rem; color: #9b59b6;"></i>
            <h5 class="mt-2">財務報表</h5>
            <a href="/reports/trial-balance" class="btn btn-outline-info btn-sm mt-2">檢視報表</a>
        </div>
    </div>
</div>

<div class="row mt-4">
    <div class="col-12">
        <div class="card">
            <div class="card-header">快速連結</div>
            <div class="card-body">
                <div class="list-group">
                    <a href="/vouchers/new" class="list-group-item list-group-item-action"><i class="bi bi-plus-circle text-success"></i> 新增傳票</a>
                    <a href="/reports/income-statement" class="list-group-item list-group-item-action"><i class="bi bi-graph-up text-primary"></i> 損益表</a>
                    <a href="/reports/balance-sheet" class="list-group-item list-group-item-action"><i class="bi bi-pie-chart text-info"></i> 資產負債表</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
