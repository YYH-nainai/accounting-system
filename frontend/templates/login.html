<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - 會計管理系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #2c3e50, #3498db); min-height: 100vh; display: flex; align-items: center; }
        .login-card { border: none; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .login-card .card-header { background: #2c3e50; color: #fff; text-align: center; border-radius: 15px 15px 0 0; padding: 1.5rem; border: none; }
        .login-card .card-body { padding: 2rem; }
        .btn-login { background: #2c3e50; color: #fff; width: 100%; padding: 0.6rem; }
        .btn-login:hover { background: #34495e; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card login-card">
                    <div class="card-header">
                        <h4 class="mb-0"><i class="bi bi-calculator"></i> 會計管理系統</h4>
                        <small class="text-light-emphasis">請登入您的帳號</small>
                    </div>
                    <div class="card-body">
                        {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                        {% endif %}
                        <form method="post">
                            <div class="mb-3">
                                <label class="form-label">帳號</label>
                                <input type="text" name="username" class="form-control" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">密碼</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-login">登入</button>
                        </form>
                        <div class="mt-3 text-muted small text-center">
                            預設帳號: admin / admin123
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
