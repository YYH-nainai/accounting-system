{% extends "base.html" %}
{% block title %}勞健保級距管理 - 會計管理系統{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="page-title mb-0">勞健保級距與費率管理</h4>
</div>

<ul class="nav nav-tabs mb-3" id="tabBar">
    <li class="nav-item"><a class="nav-link active" href="#" data-tab="grades">級距設定</a></li>
    <li class="nav-item"><a class="nav-link" href="#" data-tab="rates">費率設定</a></li>
</ul>

<div id="gradesTab">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <select class="form-select d-inline w-auto" id="gradeYear" onchange="loadGrades()">
                <option value="">全部年度</option>
            </select>
            <select class="form-select d-inline w-auto" id="gradeType" onchange="loadGrades()">
                <option value="">全部類別</option>
                <option value="labor">勞保</option>
                <option value="health">健保</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="showGradeModal()"><i class="bi bi-plus"></i> 新增級距</button>
    </div>
    <div class="card">
        <div class="card-body">
            <table class="table table-hover" id="gradesTable">
                <thead>
                    <tr>
                        <th>年度</th>
                        <th>類別</th>
                        <th>級距</th>
                        <th>薪資下限</th>
                        <th>薪資上限</th>
                        <th>投保金額</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<div id="ratesTab" style="display:none">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <select class="form-select d-inline w-auto" id="rateYear" onchange="loadRates()">
                <option value="">全部年度</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="showRateModal()"><i class="bi bi-plus"></i> 新增費率</button>
    </div>
    <div class="card">
        <div class="card-body">
            <table class="table table-hover" id="ratesTable">
                <thead>
                    <tr>
                        <th>年度</th>
                        <th>類別</th>
                        <th>費率 (%)</th>
                        <th>員工負擔 (%)</th>
                        <th>雇主負擔 (%)</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="gradeModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">新增級距</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">年度</label>
                        <input type="number" class="form-control" id="g_year">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">類別</label>
                        <select class="form-select" id="g_type">
                            <option value="labor">勞保</option>
                            <option value="health">健保</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">級距</label>
                        <input type="number" class="form-control" id="g_grade">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">薪資下限</label>
                        <input type="number" step="100" class="form-control" id="g_salary_from">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">薪資上限</label>
                        <input type="number" step="100" class="form-control" id="g_salary_to">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">投保金額</label>
                    <input type="number" step="100" class="form-control" id="g_insured_amount">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button class="btn btn-primary" onclick="saveGrade()">儲存</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="rateModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">新增費率</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="rateEditId">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">年度</label>
                        <input type="number" class="form-control" id="r_year">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">類別</label>
                        <select class="form-select" id="r_type">
                            <option value="labor">勞保</option>
                            <option value="health">健保</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">費率 (%)</label>
                        <input type="number" step="0.01" class="form-control" id="r_rate">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">員工負擔 (%)</label>
                        <input type="number" step="0.01" class="form-control" id="r_employee">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">雇主負擔 (%)</label>
                        <input type="number" step="0.01" class="form-control" id="r_employer">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button class="btn btn-primary" onclick="saveRate()">儲存</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.querySelectorAll('#tabBar .nav-link').forEach(el => {
    el.addEventListener('click', e => {
        e.preventDefault();
        document.querySelectorAll('#tabBar .nav-link').forEach(l => l.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('gradesTab').style.display = el.dataset.tab === 'grades' ? '' : 'none';
        document.getElementById('ratesTab').style.display = el.dataset.tab === 'rates' ? '' : 'none';
    });
});

function populateYears() {
    const y = new Date().getFullYear();
    const opts = [];
    for (let i = y + 1; i >= y - 5; i--) opts.push(`<option value="${i}">${i}年</option>`);
    document.getElementById('gradeYear').innerHTML = '<option value="">全部年度</option>' + opts.join('');
    document.getElementById('rateYear').innerHTML = '<option value="">全部年度</option>' + opts.join('');
}

function loadGrades() {
    const year = document.getElementById('gradeYear').value;
    const type = document.getElementById('gradeType').value;
    const params = new URLSearchParams();
    if (year) params.set('year', year);
    if (type) params.set('type', type);
    axios.get('/api/insurance/grades?' + params.toString()).then(res => {
        const tbody = document.querySelector('#gradesTable tbody');
        tbody.innerHTML = res.data.map(g => `<tr>
            <td>${g.year}</td>
            <td>${g.type === 'labor' ? '勞保' : '健保'}</td>
            <td>${g.grade}</td>
            <td class="text-end">${g.salary_from.toFixed(0)}</td>
            <td class="text-end">${g.salary_to.toFixed(0)}</td>
            <td class="text-end">${g.insured_amount.toFixed(0)}</td>
            <td><button class="btn btn-sm btn-outline-danger" onclick="delGrade(${g.id})">刪除</button></td>
        </tr>`).join('');
    });
}

function showGradeModal() {
    document.getElementById('g_year').value = new Date().getFullYear();
    document.getElementById('g_type').value = 'labor';
    document.getElementById('g_grade').value = '';
    document.getElementById('g_salary_from').value = '';
    document.getElementById('g_salary_to').value = '';
    document.getElementById('g_insured_amount').value = '';
    new bootstrap.Modal(document.getElementById('gradeModal')).show();
}

function saveGrade() {
    const data = {
        year: parseInt(document.getElementById('g_year').value),
        type: document.getElementById('g_type').value,
        grade: parseInt(document.getElementById('g_grade').value),
        salary_from: parseFloat(document.getElementById('g_salary_from').value) || 0,
        salary_to: parseFloat(document.getElementById('g_salary_to').value) || 0,
        insured_amount: parseFloat(document.getElementById('g_insured_amount').value) || 0,
    };
    axios.post('/api/insurance/grades', data).then(() => {
        bootstrap.Modal.getInstance(document.getElementById('gradeModal')).hide();
        loadGrades();
    }).catch(err => alert(err.response?.data?.detail || '操作失敗'));
}

function delGrade(id) {
    if (!confirm('確定刪除此級距？')) return;
    axios.delete('/api/insurance/grades/' + id).then(() => loadGrades()).catch(err => alert(err.response?.data?.detail || '刪除失敗'));
}

function loadRates() {
    const year = document.getElementById('rateYear').value;
    const params = new URLSearchParams();
    if (year) params.set('year', year);
    axios.get('/api/insurance/rates?' + params.toString()).then(res => {
        const tbody = document.querySelector('#ratesTable tbody');
        tbody.innerHTML = res.data.map(r => `<tr>
            <td>${r.year}</td>
            <td>${r.type === 'labor' ? '勞保' : '健保'}</td>
            <td>${r.rate_percent}</td>
            <td>${r.employee_share}</td>
            <td>${r.employer_share}</td>
            <td>
                <button class="btn btn-sm btn-outline-primary" onclick="editRate(${r.id})">編輯</button>
                <button class="btn btn-sm btn-outline-danger" onclick="delRate(${r.id})">刪除</button>
            </td>
        </tr>`).join('');
    });
}

function showRateModal(data) {
    document.getElementById('rateEditId').value = data ? data.id : '';
    document.getElementById('r_year').value = data ? data.year : new Date().getFullYear();
    document.getElementById('r_type').value = data ? data.type : 'labor';
    document.getElementById('r_rate').value = data ? data.rate_percent : '';
    document.getElementById('r_employee').value = data ? data.employee_share : '';
    document.getElementById('r_employer').value = data ? data.employer_share : '';
    new bootstrap.Modal(document.getElementById('rateModal')).show();
}

function editRate(id) {
    axios.get('/api/insurance/rates').then(res => {
        const data = res.data.find(r => r.id === id);
        if (data) showRateModal(data);
    });
}

function saveRate() {
    const id = document.getElementById('rateEditId').value;
    const data = {
        year: parseInt(document.getElementById('r_year').value),
        type: document.getElementById('r_type').value,
        rate_percent: parseFloat(document.getElementById('r_rate').value),
        employee_share: parseFloat(document.getElementById('r_employee').value),
        employer_share: parseFloat(document.getElementById('r_employer').value),
    };
    const req = id ? axios.put('/api/insurance/rates/' + id, data) : axios.post('/api/insurance/rates', data);
    req.then(() => {
        bootstrap.Modal.getInstance(document.getElementById('rateModal')).hide();
        loadRates();
    }).catch(err => alert(err.response?.data?.detail || '操作失敗'));
}

function delRate(id) {
    if (!confirm('確定刪除此費率？')) return;
    axios.delete('/api/insurance/rates/' + id).then(() => loadRates()).catch(err => alert(err.response?.data?.detail || '刪除失敗'));
}

populateYears();
loadGrades();
loadRates();
</script>
{% endblock %}
