{% extends "base.html" %}
{% block title %}傳票管理 - 會計管理系統{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="page-title mb-0">傳票管理</h4>
    <a href="/vouchers/new" class="btn btn-primary"><i class="bi bi-plus"></i> 新增傳票</a>
</div>

<div class="card">
    <div class="card-body">
        <table class="table table-hover" id="vouchersTable">
            <thead>
                <tr>
                    <th>傳票編號</th>
                    <th>日期</th>
                    <th>摘要</th>
                    <th>借方總額</th>
                    <th>貸方總額</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function loadVouchers() {
    axios.get('/api/vouchers').then(res => {
        const tbody = document.querySelector('#vouchersTable tbody');
        tbody.innerHTML = res.data.map(v => {
            const totalDebit = v.entries.reduce((s, e) => s + e.debit, 0);
            const totalCredit = v.entries.reduce((s, e) => s + e.credit, 0);
            return `<tr>
                <td>${v.voucher_no}</td>
                <td>${v.date}</td>
                <td>${v.description || ''}</td>
                <td class="text-danger">${totalDebit.toFixed(2)}</td>
                <td class="text-primary">${totalCredit.toFixed(2)}</td>
                <td>
                    <button class="btn btn-sm btn-outline-info" onclick="viewVoucher(${v.id})">檢視</button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteVoucher(${v.id})">刪除</button>
                </td>
            </tr>`;
        }).join('');
    });
}

function viewVoucher(id) {
    axios.get('/api/vouchers/' + id).then(res => {
        const v = res.data;
        const entriesHtml = v.entries.map(e =>
            `<tr><td>${e.account_code} - ${e.account_name}</td><td>${e.debit || ''}</td><td>${e.credit || ''}</td><td>${e.description || ''}</td></tr>`
        ).join('');
        const totalDebit = v.entries.reduce((s, e) => s + e.debit, 0);
        const totalCredit = v.entries.reduce((s, e) => s + e.credit, 0);
        const html = `<div class="p-3">
            <h5>${v.voucher_no}</h5>
            <p>日期: ${v.date} | 摘要: ${v.description || ''}</p>
            <table class="table table-bordered">
                <thead><tr><th>科目</th><th>借方</th><th>貸方</th><th>說明</th></tr></thead>
                <tbody>${entriesHtml}</tbody>
                <tfoot><tr class="fw-bold"><td>合計</td><td class="text-danger">${totalDebit.toFixed(2)}</td><td class="text-primary">${totalCredit.toFixed(2)}</td><td></td></tr></tfoot>
            </table>
        </div>`;
        const d = document.createElement('div');
        d.innerHTML = html;
        d.className = 'modal fade';
        d.id = 'viewModal';
        d.innerHTML = `<div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">傳票明細</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">${d.querySelector('.p-3').innerHTML}</div></div></div>`;
        document.body.appendChild(d);
        const m = new bootstrap.Modal(d);
        d.addEventListener('hidden.bs.modal', () => d.remove());
        m.show();
    });
}

function deleteVoucher(id) {
    if (!confirm('確定刪除此傳票？')) return;
    axios.delete('/api/vouchers/' + id).then(() => loadVouchers()).catch(err => alert(err.response?.data?.detail || '刪除失敗'));
}

loadVouchers();
</script>
{% endblock %}
