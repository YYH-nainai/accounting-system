{% extends "base.html" %}
{% block title %}廠商管理 - 會計管理系統{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="page-title mb-0">廠商管理</h4>
</div>

<div class="card border-2 border-dashed mb-4" style="border-style: dashed !important;">
    <div class="card-body">
        <h6 class="card-title text-muted mb-3"><i class="bi bi-plus-circle"></i> 新增廠商</h6>
        <input type="hidden" id="editId">
        <div class="row">
            <div class="col-md-3 mb-2">
                <label class="form-label small">廠商名稱</label>
                <input type="text" class="form-control form-control-sm" id="name" required>
            </div>
            <div class="col-md-2 mb-2">
                <label class="form-label small">聯絡人</label>
                <input type="text" class="form-control form-control-sm" id="contact_person">
            </div>
            <div class="col-md-2 mb-2">
                <label class="form-label small">電話</label>
                <input type="text" class="form-control form-control-sm" id="phone">
            </div>
            <div class="col-md-2 mb-2">
                <label class="form-label small">傳真</label>
                <input type="text" class="form-control form-control-sm" id="email">
            </div>
            <input type="hidden" id="code">
        </div>
        <div class="row">
            <div class="col-md-2 mb-2">
                <label class="form-label small">廠商分類</label>
                <select class="form-select form-select-sm" id="category">
                    <option value="">選擇分類</option>
                    <option value="打樣">打樣</option>
                    <option value="紙行">紙行</option>
                    <option value="製版">製版</option>
                    <option value="印刷">印刷</option>
                    <option value="上光">上光</option>
                    <option value="裁切">裁切</option>
                    <option value="裱紙">裱紙</option>
                    <option value="刀模">刀模</option>
                    <option value="軋型">軋型</option>
                    <option value="手工">手工</option>
                    <option value="外箱">外箱</option>
                    <option value="運輸">運輸</option>
                    <option value="材料">材料</option>
                    <option value="裝訂">裝訂</option>
                    <option value="糊盒">糊盒</option>
                    <option value="壓克力">壓克力</option>
                    <option value="鐵製品">鐵製品</option>
                    <option value="輸出">輸出</option>
                </select>
            </div>
            <div class="col-md-2 mb-2">
                <label class="form-label small">月結票期</label>
                <input type="text" class="form-control form-control-sm" id="payment_terms" placeholder="如：月結30天、60天票期">
            </div>
            <div class="col-md-2 mb-2">
                <label class="form-label small">銀行名稱</label>
                <input type="text" class="form-control form-control-sm" id="bank_name">
            </div>
            <div class="col-md-1 mb-2">
                <label class="form-label small">分行</label>
                <input type="text" class="form-control form-control-sm" id="bank_branch">
            </div>
            <div class="col-md-1 mb-2">
                <label class="form-label small">代碼</label>
                <input type="text" class="form-control form-control-sm" id="bank_code">
            </div>
            <div class="col-md-2 mb-2">
                <label class="form-label small">銀行帳號</label>
                <input type="text" class="form-control form-control-sm" id="bank_account">
            </div>
            <div class="col-md-2 mb-2">
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-2">
                <label class="form-label small">地址</label>
                <input type="text" class="form-control form-control-sm" id="address">
            </div>
            <div class="col-md-8 mb-2 d-flex align-items-end justify-content-end">
                <button class="btn btn-primary btn-sm me-2" onclick="save()"><i class="bi bi-check-lg"></i> 儲存</button>
                <button class="btn btn-outline-secondary btn-sm" onclick="resetForm()"><i class="bi bi-x-lg"></i> 清除</button>
            </div>
        </div>
    </div>
</div>

<div class="d-flex align-items-center mb-2">
    <h6 class="mb-0 text-muted">廠商列表</h6>
</div>
<div class="card">
    <div class="card-body">
        <table class="table table-hover" id="dataTable">
            <thead>
                <tr>
                    <th>廠商</th>
                    <th>廠商名稱</th>
                    <th>分類</th>
                    <th>聯絡人</th>
                    <th>電話</th>
                    <th>銀行</th>
                    <th>分行</th>
                    <th>帳號</th>
                    <th>月結票期</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function loadData() {
    axios.get('/api/vendors').then(res => {
        const tbody = document.querySelector('#dataTable tbody');
        tbody.innerHTML = res.data.map(v => `<tr>
            <td>${v.code}</td>
            <td>${v.name}</td>
            <td>${v.category || '-'}</td>
            <td>${v.contact_person || '-'}</td>
            <td>${v.phone || '-'}</td>
            <td>${v.bank_name || '-'}</td>
            <td>${v.bank_branch || '-'}</td>
            <td>${v.bank_account || '-'}</td>
            <td>${v.payment_terms || '-'}</td>
            <td>
                <button class="btn btn-sm btn-outline-primary" onclick="edit(${v.id})">編輯</button>
                <button class="btn btn-sm btn-outline-danger" onclick="del(${v.id})">刪除</button>
            </td>
        </tr>`).join('');
    });
}

function autoCode() {
    axios.get('/api/vendors/').then(res => {
        const codes = res.data.map(v => v.code).filter(c => c && c.startsWith('V'));
        let max = 0;
        codes.forEach(c => { const n = parseInt(c.slice(1)); if (n > max) max = n; });
        const next = 'V' + String(max + 1).padStart(3, '0');
        document.getElementById('code').value = next;
    });
}

function resetForm() {
    document.getElementById('editId').value = '';
    autoCode();
    document.getElementById('name').value = '';
    document.getElementById('category').value = '';
    document.getElementById('contact_person').value = '';
    document.getElementById('phone').value = '';
    document.getElementById('email').value = '';
    document.getElementById('address').value = '';
    document.getElementById('bank_name').value = '';
    document.getElementById('bank_branch').value = '';
    document.getElementById('bank_code').value = '';
    document.getElementById('bank_account').value = '';
    document.getElementById('payment_terms').value = '';
}

function fillForm(data) {
    document.getElementById('editId').value = data.id;
    document.getElementById('code').value = data.code;
    document.getElementById('name').value = data.name;
    document.getElementById('category').value = data.category || '';
    document.getElementById('contact_person').value = data.contact_person || '';
    document.getElementById('phone').value = data.phone || '';
    document.getElementById('email').value = data.email || '';
    document.getElementById('address').value = data.address || '';
    document.getElementById('bank_name').value = data.bank_name || '';
    document.getElementById('bank_branch').value = data.bank_branch || '';
    document.getElementById('bank_code').value = data.bank_code || '';
    document.getElementById('bank_account').value = data.bank_account || '';
    document.getElementById('payment_terms').value = data.payment_terms || '';
}

function edit(id) {
    axios.get('/api/vendors/' + id).then(res => fillForm(res.data));
}

function save() {
    const id = document.getElementById('editId').value;
    const data = {
        code: document.getElementById('code').value,
        name: document.getElementById('name').value,
        category: document.getElementById('category').value || null,
        contact_person: document.getElementById('contact_person').value,
        phone: document.getElementById('phone').value,
        email: document.getElementById('email').value,
        address: document.getElementById('address').value,
        bank_name: document.getElementById('bank_name').value,
        bank_branch: document.getElementById('bank_branch').value,
        bank_code: document.getElementById('bank_code').value,
        bank_account: document.getElementById('bank_account').value,
        payment_terms: document.getElementById('payment_terms').value,
    };
    if (!data.code || !data.name) { alert('請填寫廠商編號與名稱'); return; }
    const req = id ? axios.put('/api/vendors/' + id, data) : axios.post('/api/vendors', data);
    req.then(() => { resetForm(); loadData(); })
      .catch(err => alert(err.response?.data?.detail || '操作失敗'));
}

function del(id) {
    if (!confirm('確定刪除此廠商？')) return;
    axios.delete('/api/vendors/' + id).then(() => loadData()).catch(err => alert(err.response?.data?.detail || '刪除失敗'));
}

loadData();
autoCode();
</script>
{% endblock %}
